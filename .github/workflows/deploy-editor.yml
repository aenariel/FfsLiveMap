name: Deploy hive editor

# Deploys the editor service (worker/) to Cloudflare: database migrations, the Worker and its secrets.
# Runs when worker/ or this file changes on main, or by hand (Actions -> Deploy hive editor -> Run workflow).
# Needs the repository secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and EDITOR_ADMIN_CODE;
# GH_DISPATCH_TOKEN is optional (lets a save re-render the maps right away).

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-editor.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-editor
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_CODE: ${{ secrets.EDITOR_ADMIN_CODE }}
      GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Check secrets
        run: |
          missing=""
          for s in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ADMIN_CODE; do
            if [ -z "${!s}" ]; then missing="$missing $s"; fi
          done
          if [ -n "$missing" ]; then echo "::error::Missing secrets:$missing (ADMIN_CODE comes from EDITOR_ADMIN_CODE)"; exit 1; fi
          if [ ${#ADMIN_CODE} -lt 12 ]; then echo "::error::EDITOR_ADMIN_CODE must have at least 12 characters"; exit 1; fi
          echo "Secrets present. GH_DISPATCH_TOKEN: $([ -n "$GH_DISPATCH_TOKEN" ] && echo set || echo not set, saves won't re-render right away)"

      - run: npm ci --no-audit --no-fund

      - name: Apply database migrations
        run: npx wrangler d1 migrations apply hive-editor --remote

      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Set secrets
        run: |
          printf '%s' "$ADMIN_CODE" | npx wrangler secret put ADMIN_CODE
          if [ -n "$GH_DISPATCH_TOKEN" ]; then
            printf '%s' "$GH_DISPATCH_TOKEN" | npx wrangler secret put GH_DISPATCH_TOKEN
          else
            echo "GH_DISPATCH_TOKEN not set, skipped"
          fi

      - name: Smoke test
        run: |
          sleep 5
          url="https://hive-editor.kstools.workers.dev/api/maps"
          echo "GET $url"
          curl -fsS --retry 5 --retry-delay 5 "$url"; echo
