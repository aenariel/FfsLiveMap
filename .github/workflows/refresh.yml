name: Refresh bear trap maps

on:
  schedule:
    - cron: "0 0 * * *"   # 00:00 UTC, server reset (GitHub may start it a few minutes late)
  workflow_dispatch:
    inputs:
      update:
        description: "Send the Update Map request to MightPulse (uncheck to use the last scan)"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-maps
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      pages: ${{ steps.site.outputs.ready }}
    env:
      PAGES_DIR: ${{ secrets.PAGES_DIR }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Refresh maps
        id: refresh
        continue-on-error: true
        run: |
          FLAGS="--site site_build"
          if [ "${{ github.event_name == 'workflow_dispatch' && !inputs.update }}" = "true" ]; then
            FLAGS="$FLAGS --no-update"
          fi
          node refresh.cjs $FLAGS

      - name: Commit and push
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ffs-bear-traps.png plan.csv live.csv sbm-bear-traps.png sbm-plan.csv sbm-live.csv
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -q -m "Daily refresh $(date -u +%F)"
          for i in 1 2 3; do
            git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 10
          done
          echo "::error::Push failed"
          exit 1

      - name: Prepare interactive pages
        id: site
        if: always()
        run: |
          if [ -z "$PAGES_DIR" ]; then echo "PAGES_DIR secret not set, skipping pages."; exit 0; fi
          if ! printf '%s' "$PAGES_DIR" | grep -Eq '^[A-Za-z0-9_-]{16,}$'; then echo "::error::PAGES_DIR must be 16+ letters, digits, - or _"; exit 1; fi
          if ! ls site_build/*.html >/dev/null 2>&1; then echo "No pages rendered, skipping."; exit 0; fi
          mkdir -p "_site/$PAGES_DIR"
          cp site_build/*.html "_site/$PAGES_DIR/"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v4
        if: always() && steps.site.outputs.ready == 'true'
        with:
          path: _site
          retention-days: 1

      - name: Report failure
        if: always() && steps.refresh.outcome == 'failure'
        run: |
          echo "::error::Refresh reported a failure. See the job summary for details."
          exit 1

  pages:
    needs: refresh
    if: always() && needs.refresh.outputs.pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
